<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYD by AH – všetky funkcie</title>
<meta name="description" content="Kompletný strom všetkých 287 funkcií aplikácie BYD by AH. Približujte prstami alebo kolieskom myši.">
<meta property="og:title" content="BYD by AH – všetky funkcie">
<meta property="og:description" content="Kompletný strom 287 funkcií. Približujte prstami alebo kolieskom myši.">
<meta property="og:image" content="https://andrejhlatky13.github.io/bydbyah/pavuk-facebook.jpg">
<meta property="og:url" content="https://andrejhlatky13.github.io/bydbyah/funkcie.html">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0A0E13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230A0E13' width='32' height='32' rx='6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='sans-serif' font-weight='800' fill='%23C6F432'%3EAH%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0A0E13; --lime:#C6F432; --tx:#E8EEF3; --mu:#B8C4CF; --panel:#121A14; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tx);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background:var(--panel); border-bottom:1px solid #1d2a20;
    position:relative; z-index:2;
  }
  header h1 { margin:0; font-size: clamp(16px, 3.6vw, 22px); font-weight:800; letter-spacing:-0.02em; }
  header h1 span { color:var(--lime); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  a.btn, a.btn2 {
    display:inline-block; text-decoration:none; font-weight:700; border-radius:12px;
    padding:8px 12px; font-size:14px; white-space:nowrap;
  }
  a.btn { background:var(--lime); color:#0A0E13; }
  a.btn2 { border:1.5px solid var(--lime); color:var(--lime); }
  a.home { color:var(--mu); text-decoration:none; font-weight:600; font-size:14px; margin-right:4px; }
  #viewer { position:absolute; top:var(--hdr, 64px); left:0; right:0; bottom:0; background:var(--bg); }
  .hint {
    position:absolute; left:50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:3;
    background:rgba(10,14,19,.82); color:var(--mu); font-size:13px; font-weight:600;
    padding:7px 12px; border-radius:999px; pointer-events:none;
    border:1px solid #263341; opacity:1; transition:opacity .6s ease 3.2s;
  }
  body.ready .hint { opacity:0; }
  @media (max-width: 640px) {
    header { flex-wrap:wrap; }
    header h1 { flex:1 1 auto; }
    .actions { width:100%; }
    a.btn, a.btn2 { flex:1 1 auto; text-align:center; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="./">← Späť</a>
  <h1>BYD <span>by</span> AH – všetky funkcie</h1>
  <div class="actions">
    <a class="btn" href="pavuk-funkcie-byd-by-ah.pdf" download>⬇ PDF</a>
    <a class="btn2" href="pavuk-kompletny.jpg" download>⬇ JPG (11 MB)</a>
  </div>
</header>
<div id="viewer"></div>
<div class="hint">Približujte prstami alebo kolieskom myši · posúvajte ťahaním</div>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.3/build/openseadragon/openseadragon.min.js"></script>
<script>
  (function () {
    function sizeHeader() {
      var h = document.querySelector('header');
      document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
    }
    sizeHeader();
    window.addEventListener('resize', sizeHeader);

    var viewer = OpenSeadragon({
      id: 'viewer',
      prefixUrl: 'https://cdn.jsdelivr.net/npm/openseadragon@4.1.3/build/openseadragon/images/',
      tileSources: 'pavuk.dzi',
      showNavigator: window.innerWidth >= 800,
      navigatorPosition: 'BOTTOM_RIGHT',
      showRotationControl: false,
      visibilityRatio: 1,
      minZoomImageRatio: 0.9,
      maxZoomPixelRatio: 2,
      homeFillsViewer: true,
      animationTime: 0.5,
      springStiffness: 8,
      gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true, scrollToZoom: true, flickEnabled: true },
      gestureSettingsTouch: { pinchToZoom: true, flickEnabled: true, clickToZoom: false, dblClickToZoom: true }
    });
    viewer.addHandler('open', function () {
      document.body.classList.add('ready');
    });
  })();
</script>
</body>
</html>
